const $=x=>document.querySelector(x);
let current=-1,L="es";
const ui=()=>UI[L];
function setText(){
const u=ui();document.documentElement.lang=L;
title.textContent=u.title;langLabel.textContent=u.lang;intro.textContent=u.intro;inboxTitle.textContent=u.inbox;
empty.textContent=u.empty;listen.textContent=u.listen;stopBtn.textContent=u.stop;transSum.textContent=u.trans;answerTitle.textContent=u.answer;
mic.textContent=u.mic;micStop.textContent=u.micStop;evaluate.textContent=u.evaluate;modelBtn.textContent=u.model;
teacherTitle.textContent=u.teacher;lblGroup.textContent=u.group;lblSubject.textContent=u.subject;lblCaller.textContent=u.callerL;
lblText.textContent=u.text;lblKeys.textContent=u.keys;lblModel.textContent=u.modelL;addBtn.textContent=u.add;
document.title=u.title;
groupList.innerHTML="";Object.values(GROUPS[L]).forEach(g=>{let o=document.createElement("option");o.value=g;groupList.appendChild(o)});
if(!recognition||!listening)micStatus.textContent=SR?u.micHelp:u.micNA;
}
function esc(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}
function lvl(x){return ui().levels[x.d]||x.d}
function render(){
inbox.innerHTML="";
Object.keys(GROUPS[L]).forEach(g=>{
const items=calls.map((x,i)=>[x,i]).filter(([x])=>x.l===L&&x.g===g);
if(!items.length)return;
let h=document.createElement("h3");h.className="group";h.textContent=GROUPS[L][g];inbox.appendChild(h);
items.forEach(([x,i])=>{let b=document.createElement("button");b.className="card callbtn";
b.innerHTML="<b>"+esc(x.s)+"</b><br><span class='muted'>"+esc(x.c)+" · "+esc(lvl(x))+"</span>";
b.onclick=()=>openCall(i);inbox.appendChild(b)})})}
function openCall(i){current=i;let x=calls[i];empty.classList.add("hidden");practice.classList.remove("hidden");subject.textContent=x.s;caller.textContent=x.c+" · "+lvl(x);transcript.textContent=x.t;answer.value="";callStatus.textContent="";feedback.classList.add("hidden");speechSynthesis.cancel()}
listen.onclick=()=>{if(current<0)return;let u=new SpeechSynthesisUtterance(calls[current].t);u.lang=ui().speech;u.rate=.95;
let v=speechSynthesis.getVoices().some(v=>v.lang.toLowerCase().startsWith(L));
callStatus.textContent=v||!speechSynthesis.getVoices().length?ui().playing:ui().noVoice;
u.onend=()=>callStatus.textContent=ui().ended;speechSynthesis.cancel();speechSynthesis.speak(u)};
stopBtn.onclick=()=>{speechSynthesis.cancel();callStatus.textContent=ui().stopped};

// Reconocimiento de voz (Chrome/Edge y navegadores compatibles)
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,listening=false;
if(SR){
recognition=new SR();recognition.continuous=true;recognition.interimResults=true;
recognition.onstart=()=>{listening=true;mic.disabled=true;micStop.disabled=false;micStatus.textContent=ui().listening};
recognition.onresult=e=>{let f="",im="";
for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)f+=t+" ";else im+=t}
if(f){const p=answer.value.trim();answer.value=(p?p+" ":"")+f.trim()}
micStatus.textContent=im?ui().listeningIt+im:ui().listeningDots};
recognition.onerror=e=>{micStatus.textContent=ui().micErr+e.error+ui().micErr2};
recognition.onend=()=>{listening=false;mic.disabled=false;micStop.disabled=true;micStatus.textContent=answer.value.trim()?ui().micDone:ui().micNone};
mic.onclick=()=>{if(current<0){micStatus.textContent=ui().micPick;return}
speechSynthesis.cancel();recognition.lang=ui().speech;
try{recognition.start()}catch(e){micStatus.textContent=ui().micBusy}};
micStop.onclick=()=>{if(recognition&&listening)recognition.stop()};
}else{mic.disabled=true;micStop.disabled=true}

evaluate.onclick=()=>{if(current<0)return;const u=ui(),x=calls[current],a=answer.value.toLowerCase();
const hit=[],miss=[];
x.keys.forEach(k=>{(k.split("|").some(s=>a.includes(s.trim()))?hit:miss).push(k.split("|")[0])});
const r=hit.length/x.keys.length;
feedback.classList.remove("hidden");
feedback.innerHTML=(r>=.6?u.good:r>0?u.mid:u.bad)+
(hit.length?"<p>✅ "+u.found+esc(hit.join(", "))+"</p>":"")+(miss.length?"<p>⚠️ "+u.missing+esc(miss.join(", "))+"</p>":"")};
modelBtn.onclick=()=>{if(current<0)return;feedback.classList.remove("hidden");feedback.innerHTML="<b>"+ui().modelT+"</b><p>"+esc(calls[current].m)+"</p>"};
addBtn.onclick=()=>{const keys=newKeys.value.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);
if(!newSubject.value||!newCaller.value||!newText.value||!newModel.value||!keys.length){alert(ui().fill);return}
const gv=newGroup.value.trim()||ui().custom;
let gid=Object.keys(GROUPS[L]).find(k=>GROUPS[L][k]===gv);
if(!gid){gid="c_"+gv;GROUPS[L][gid]=gv}
calls.push({l:L,g:gid,d:ui().custom,s:newSubject.value,c:newCaller.value,t:newText.value,keys:keys,m:newModel.value});
current=-1;practice.classList.add("hidden");empty.classList.remove("hidden");
render();setText();newSubject.value=newCaller.value=newText.value=newKeys.value=newModel.value=""};
lang.onchange=()=>{L=lang.value;speechSynthesis.cancel();if(recognition&&listening)recognition.stop();current=-1;practice.classList.add("hidden");empty.classList.remove("hidden");setText();render()};
speechSynthesis.onvoiceschanged=()=>{};
setText();render();
</script>
